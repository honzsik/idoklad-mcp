name: Release

# Publishes to npm when you push a version tag, e.g. `npm version minor && git push --follow-tags`.
# Uses npm trusted publishing (no npm token stored in GitHub). One-time setup on npmjs.com:
# package Settings → Trusted publishing → GitHub Actions, repo honzsik/idoklad-mcp, workflow release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
